[project]
name = "poker_run_fastapi"
version = "0.1.0"
description = "FastAPI backend for PokerRun application"
requires-python = ">=3.10,<3.15"

dependencies = [
    "fastapi[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv",
    "alembic>=1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
